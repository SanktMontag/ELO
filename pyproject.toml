[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khl-elo"
version = "1.0.0"
description = "ELO ratings for the Kraken Hockey League ladder divisions"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
khl = "khl_elo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
